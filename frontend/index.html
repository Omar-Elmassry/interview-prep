    if (t) {
      try {
        parsed = parseBackup(t);
        const when = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "unknown date";
        info.className = "note good";
        info.innerHTML = `<span class="h">Backup from ${esc(when)}.</span> It has ${esc(describeBackup(parsed))}.`;
      } catch (err) {
        info.className = "note bad";
        info.innerHTML = `<span class="h">Can’t import this.</span> ${esc(err.message)}`;
      }
    }
    btns.forEach((b) => (b.disabled = !parsed));
  };
  ta.addEventListener("input", check);
  file.addEventListener("change", async () => {
    const f = file.files && file.files[0];
    if (!f) return;
    try { ta.value = await f.text(); } catch { ta.value = ""; toast("Couldn’t read that file"); }
    check();
  });
  el.addEventListener("click", (e) => {
    const b = e.target.closest("[data-d]");
    if (!b || b.disabled) return;
    if (b.dataset.d === "close") return closeDialog(false);
    if (b.dataset.d === "replace" && !b.dataset.armed) {
      b.dataset.armed = "1";
      b.textContent = "Click again to replace";
      return;
    }
    applyBackup(parsed, b.dataset.d);
    closeDialog(false);
    render(true);
    toast(b.dataset.d === "merge" ? "Backup merged" : "Data replaced with the backup");
  });
  ta.focus();
}

// ============================================================
// Events
// ============================================================
function toggleIn(list, v) { const i = list.indexOf(v); i >= 0 ? list.splice(i, 1) : list.push(v); }

document.getElementById("themeBtn").addEventListener("click", cycleTheme);
document.getElementById("sizeDown").addEventListener("click", () => setSize(sizeIdx - 1));
document.getElementById("sizeUp").addEventListener("click", () => setSize(sizeIdx + 1));
document.getElementById("fsBtn").addEventListener("click", toggleFullscreen);
document.addEventListener("fullscreenchange", () => { applyFullscreen(); if (view === "settings") render(); });
document.getElementById("pauseBtn").addEventListener("click", () => (session?.paused ? resumeSession() : pauseSession()));
document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-view]");
  if (!b) return;
  view = b.dataset.view;
  render(true);
});

async function onAction(e) {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const d = el.dataset;
  switch (d.act) {
    // library
    case "all-cats":
      filters.cats = filters.cats.length === CATEGORIES.length ? [] : CATEGORIES.map((c) => c.id);
      saveFilters(); render(); break;
    case "topic": toggleIn(filters.topics, d.key); saveFilters(); render(); break;
    case "clear-topics": filters.topics = filters.topics.filter((t) => !t.startsWith(d.cat + ":")); saveFilters(); render(); break;
    case "diff": toggleIn(filters.diff, d.v); saveFilters(); render(); break;
    case "imp": toggleIn(filters.imp, Number(d.v)); saveFilters(); render(); break;
    case "set": filters[d.k] = d.k === "length" && d.v !== "all" ? Number(d.v) : d.v; saveFilters(); render(); break;
    case "reset-filters": filters = defaultFilters(); saveFilters(); render(); break;
    case "start": {
      if (session && !(await dialog({ title: "Replace the session in progress?", body: "Your current session will be discarded.", ok: "Start new session", cancel: "Cancel" }))) return;
      startSession(pickIds(matching()), sessionLabel(filters.cats, filters.source));
      break;
    }
    case "quick": {
      if (session && !(await dialog({ title: "Replace the session in progress?", body: "Your current session will be discarded.", ok: "Start new session", cancel: "Cancel" }))) return;
      const pool = matching({ cats: [d.cat], topics: [] });
      if (!pool.length) return toast("No questions match your difficulty, type or source filters");
      startSession(pickIds(pool), sessionLabel([d.cat], filters.source));
      break;
    }
    case "open-session": view = "session"; render(true); break;
    case "discard":
      if (await dialog({ title: "Discard this session?", body: "Answers you’ve already given still count toward your weak questions.", ok: "Discard", cancel: "Keep it" })) { session = null; saveSession(); render(); }
      break;
    case "view-report": report = history.find((s) => s.id === d.id) || null; reviewFilter = "all"; view = "report"; render(true); break;
    case "clear-history":
      if (await dialog({ title: "Delete all reports?", body: `Deletes all ${plural(history.length, "report")} and undoes the results they recorded. Bookmarks are kept, and results from older versions of this app stay.`, ok: "Delete all", cancel: "Cancel" })) { deleteSessions(history.map((x) => x.id)); render(); toast("All reports deleted"); }
      break;
    // session
    case "opt": chooseOption(Number(d.i)); break;
    case "primary": primaryAction(); break;
    case "rate": rate(d.v); break;
    case "skip": skip(); break;
    case "prev": goTo(session.idx - 1); break;
    case "end": confirmEnd(); break;
    case "resume": resumeSession(); break;
    case "mark": toggleMark(curId()); break;
    // report
    case "rfilter": {
      reviewFilter = d.f;
      const r = summarize(report);
      document.getElementById("review").innerHTML = renderReview(report, Math.max(r.avg * 1.5, 30000));
      document.querySelectorAll('[data-act="rfilter"]').forEach((c) => { c.classList.toggle("on", c.dataset.f === reviewFilter); c.setAttribute("aria-selected", String(c.dataset.f === reviewFilter)); });
      break;
    }
    case "goto": {
      if (reviewFilter !== "all") { reviewFilter = "all"; render(); }
      const det = document.getElementById(`rv-${d.id}`);
      if (det) {
        det.open = true;
        det.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
        det.classList.add("flash");
        setTimeout(() => det.classList.remove("flash"), 1500);
      }
      break;
    }
    case "retry": {
      if (session && !(await dialog({ title: "Replace the session in progress?", body: "Your current session will be discarded.", ok: "Start new session", cancel: "Cancel" }))) return;
      const ids = report.ids.filter((id) => { const r = report.answers[id]?.result; return r && r !== "correct" && r !== "got"; });
      startSession(filters.shuffle ? shuffle(ids) : ids, `Retry · ${report.label}`);
      break;
    }
    case "copy-report": copyReport(); break;
    case "print": printReport(); break;
    case "export": showExport(); break;
    case "import": showImport(); break;
    case "to-library": view = "library"; render(true); break;
    // settings
    case "to-settings": view = "settings"; render(true); break;
    case "mode": setMode(THEMES.indexOf(d.v)); break;
    case "size": setSize(Number(d.v)); break;
    case "fullscreen": toggleFullscreen(); break;
    case "shortcuts": showShortcuts(); break;
    // browse
    case "to-browse": view = "browse"; browseLimit = 30; render(true); break;
    case "cat-chip": toggleIn(filters.cats, d.cat); saveFilters(); render(); break;
    case "more": browseLimit += 30; refreshBrowseList(); break;
    case "clear-search": browseQuery = ""; browseLimit = 30; render(); break;
    case "bmark": {
      marks.has(d.id) ? marks.delete(d.id) : marks.add(d.id);
      saveMarks();
      el.classList.toggle("on", marks.has(d.id));
      el.setAttribute("aria-pressed", String(marks.has(d.id)));
      toast(marks.has(d.id) ? "Bookmarked" : "Bookmark removed");
      renderChrome();
      break;
    }
    case "practise-browse": {
      const ids = browseIds();
      if (!ids.length) return;
      if (session && !(await dialog({ title: "Replace the session in progress?", body: "Your current session will be discarded.", ok: "Start new session", cancel: "Cancel" }))) return;
      startSession(pickIds(ids), sessionLabel(filters.cats, filters.source) + (browseQuery ? ` · “${browseQuery}”` : ""));
      break;
    }
    // per-category reset of "seen"
    case "cat-new": {
      const c = CATEGORIES.find((x) => x.id === d.cat);
      const seen = c.questions.filter((q) => isSeen(q.id)).length;
      if (!(await dialog({ title: `Mark ${c.title} as new?`, body: `${plural(seen, "seen question")} in ${c.title} will count as new again. Your results, weak questions and bookmarks are kept.`, ok: "Mark as new", cancel: "Cancel" }))) return;
      markCategoryNew(c.id);
      render();
      toast(`${c.title}: all questions are new again`);
      break;
    }
    // history
    case "toggle-history": showAllHistory = !showAllHistory; render(); break;
    case "del-report": {
      const s = history.find((x) => x.id === d.id);
      if (!s) return;
      const n = summarize(s).done.length;
      if (!(await dialog({ title: "Delete this report?", body: `Deletes “${s.label}” and undoes the results it recorded (${plural(n, "question")}). Those questions go back to the result you had before this session.`, ok: "Delete report", cancel: "Cancel" }))) return;
      const wasOpen = view === "report" && report && report.id === s.id;
      deleteSessions([s.id]);
      if (wasOpen) view = "library";
      render(wasOpen);
      toast("Report deleted and its results undone");
      break;
    }
  }
}
stage.addEventListener("click", onAction);
actionbarEl.addEventListener("click", onAction);

stage.addEventListener("change", (e) => {
  const d = e.target.dataset;
  if (d.change === "cat") { toggleIn(filters.cats, d.cat); saveFilters(); render(); }
  else if (d.change === "classic") { filters.classic = e.target.checked; saveFilters(); render(); }
  else if (d.change === "likely") { filters.likely = e.target.checked; saveFilters(); render(); }
  else if (d.change === "shuffle") { filters.shuffle = e.target.checked; saveFilters(); render(); }
  else if (d.change === "preferNew") { filters.preferNew = e.target.checked; saveFilters(); render(); }
  else if (d.change === "palette") setPalette(e.target.value);
  else if (d.change === "font-sans") setFont("sans", e.target.value);
  else if (d.change === "font-mono") setFont("mono", e.target.value);
  else if (d.change === "ligatures") setLigatures(e.target.checked);
  else if (d.change === "kp" && session) toggleKeyPoint(Number(d.i));
});
let searchTimer;
stage.addEventListener("input", (e) => {
  if (e.target.id === "open-text" && session) { ans(curId()).text = e.target.value; saveSession(); }
  if (e.target.id === "browse-search") {
    clearTimeout(searchTimer);
    const value = e.target.value;
    searchTimer = setTimeout(() => { browseQuery = value.trim(); browseLimit = 30; refreshBrowseList(); renderChrome(); }, 120);
  }
});

document.addEventListener("keydown", (e) => {
  if (document.querySelector(".scrim")) { if (e.key === "Escape") closeDialog(false); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const typing = e.target.matches && e.target.matches("input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea, [contenteditable]");
  if (typing) {
    if (e.key === "Escape") {
      if (e.target.id === "browse-search" && e.target.value) { e.target.value = ""; browseQuery = ""; browseLimit = 30; refreshBrowseList(); renderChrome(); }
      else e.target.blur();
    }
    return;
  }
  const k = e.key.toLowerCase();
  if (k === "t") { cycleTheme(); return; }
  if (e.key === "?") { e.preventDefault(); showShortcuts(); return; }
  if (k === "f" && FS_OK) { toggleFullscreen(); return; }
  if (e.key === "-" || e.key === "_") { setSize(sizeIdx - 1); return; }
  if (e.key === "=" || e.key === "+") { setSize(sizeIdx + 1); return; }
  if (view === "browse" && e.key === "/") { e.preventDefault(); document.getElementById("browse-search")?.focus(); return; }
  if (view !== "session" || !session) return;
  if (session.paused) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); resumeSession(); } return; }
  const q = Q.get(curId()), a = ans(q.id);
  if (/^[1-9]$/.test(e.key) && q.type === "mcq" && !a.result) { e.preventDefault(); chooseOption(Number(e.key) - 1); return; }
  if (/^[1-9]$/.test(e.key) && q.type === "open" && a.revealed) { e.preventDefault(); toggleKeyPoint(Number(e.key) - 1); return; }
  // Enter always means the main action, unless focus is on a link or on the main button itself.
  if (e.key === "Enter" && !(e.target.closest && e.target.closest('a, [data-act="primary"]'))) { e.preventDefault(); primaryAction(); return; }
  if (e.key === " " && q.type === "open" && !a.revealed && !(e.target.closest && e.target.closest("button, a"))) { e.preventDefault(); revealAnswer(); return; }
  if (q.type === "open" && a.revealed && { g: "got", p: "partly", m: "missed" }[k]) { rate({ g: "got", p: "partly", m: "missed" }[k]); return; }
  if (k === "s") { skip(); return; }
  if (k === "b") { toggleMark(q.id); return; }
  if (e.key === "ArrowLeft") { goTo(session.idx - 1); return; }
  if (e.key === "ArrowRight" && a.result) { nextOrFinish(); return; }
});

// Closing or hiding the page records the time so a restored session can pause cleanly.
window.addEventListener("pagehide", () => { if (session) { session.lastSeen = now(); saveSession(); } });
setInterval(() => { if (session && !session.paused) { session.lastSeen = now(); store.set(K.session, session); } }, 5000);

applyTheme();
applyPalette();
if (typeof matchMedia === "function") { const mq = matchMedia("(prefers-color-scheme: dark)"); if (mq.addEventListener) mq.addEventListener("change", applyBrandColors); }
applySize();
applyFonts();
applyFullscreen();
render(true);
// Tell the user once if a font they picked earlier can't be downloaded now.
for (const kind of ["sans", "mono"]) if (fontOf(kind).gf) checkFont(kind);
</script>
