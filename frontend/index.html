/* Reading-text scale, set from Settings or A− / A+ (not a colour token). */
:root{--fs:1}

/* Standalone reset: a page opened from disk has no host skeleton. */
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
code,kbd,pre,textarea.mono{font-family:var(--mono);font-variant-ligatures:var(--lig,normal)}
:not(pre)>code{font-size:.86em;background:var(--icBg);border:1px solid var(--line);border-radius:5px;padding:.05em .38em;overflow-wrap:anywhere;color:var(--cy)}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--kbdBg);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.ide{display:flex;flex-direction:column;height:100%;min-height:0;position:relative}

/* ---- title bar ---- */
.titlebar{display:flex;align-items:center;gap:14px;padding:0 14px;height:40px;flex:0 0 auto;background:var(--chrome);border-bottom:1px solid var(--line)}
.lights{display:flex;gap:7px;flex:0 0 auto}
.lights i{width:11px;height:11px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#E0646E}.lights i:nth-child(2){background:#E0B054}.lights i:nth-child(3){background:#7FC08A}
.crumb{font-family:var(--mono);font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.crumb b{color:var(--dim);font-weight:500}
.crumb em{color:var(--acc);font-style:normal}
.clock{font-family:var(--mono);font-size:12.5px;color:var(--fg);display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.clock .g{color:var(--acc)}
.clock.paused{color:var(--type)}
.clock.paused .g{color:var(--type)}
.tbtn{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--dim);background:transparent;border:1px solid var(--line2);border-radius:6px;padding:5px 10px;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;line-height:1.6}
.tbtn .g{font-size:13px;line-height:1}
.tbtn:hover{color:var(--fg);border-color:var(--faint);background:var(--hov)}
.tbtn.on{color:var(--type);border-color:var(--type)}
.tsize{display:inline-flex;flex:0 0 auto}
.tsize .tbtn{border-radius:0;padding:5px 8px}
.tsize .tbtn:first-child{border-radius:6px 0 0 6px;border-right-width:0}
.tsize .tbtn:last-child{border-radius:0 6px 6px 0}
@media (max-width:620px){.tlabel{display:none}.tbtn{padding:5px 8px}.titlebar{gap:10px}.lights{display:none}.tsize{display:none}}

/* ---- tab strip ---- */
.tabs{display:flex;flex:0 0 auto;background:var(--chrome2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.tabs::-webkit-scrollbar{height:4px}.tabs::-webkit-scrollbar-thumb{background:var(--line2)}
.tab{font-family:var(--mono);font-size:12px;color:var(--faint);background:transparent;border:0;border-right:1px solid var(--line);border-top:2px solid transparent;padding:8px 14px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--dim);background:var(--hov)}
.tab[aria-current="true"]{color:var(--fg);background:var(--bg);border-top-color:var(--acc)}
.tab .dot{color:var(--acc);opacity:.75}

/* ---- stage ---- */
.body{display:flex;flex:1;min-height:0}
.stage{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;display:flex;flex-direction:column}
.stage::-webkit-scrollbar{width:8px}.stage::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.page{width:100%;max-width:1120px;margin:0 auto;padding:clamp(22px,3.4vw,44px) 16px 40px;display:flex;flex-direction:column;gap:26px;flex:1 0 auto;animation:in .2s ease-out}
@media (min-width:700px){.page{padding-left:clamp(20px,3.5vw,44px);padding-right:clamp(20px,3.5vw,44px)}}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.eyebrow{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.16em;color:var(--acc);text-transform:uppercase}
h1.t{font-size:clamp(26px,3.4vw,38px);font-weight:600;letter-spacing:-.01em;margin-top:6px}
.lead{font-size:clamp(15px,1.4vw,17px);color:var(--dim);max-width:70ch;margin-top:10px}
.lead b{color:var(--fg);font-weight:600}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-h h2{font-size:17px;font-weight:600}
.section-h .hint{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--dim)}
.faint{color:var(--faint)}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.stat{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat .k{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.01em}
.stat .v small{font-size:13px;color:var(--dim);font-weight:400;margin-left:3px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--hov);border-color:var(--faint)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--acc);border-color:var(--acc)}
.btn.ghost{background:transparent}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn kbd{margin-left:2px}
.btn.primary kbd{background:transparent;border-color:currentColor;color:inherit;opacity:.7}

/* category cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cat-card{--cat:var(--fn);position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .12s}
.cat-card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--cat);opacity:.25;border-radius:var(--r) var(--r) 0 0}
.cat-card.on{border-color:var(--line2)}
.cat-card.on::before{opacity:1}
.cat-head{display:flex;align-items:center;gap:10px;cursor:pointer}
.cat-head input{width:17px;height:17px;margin:0;accent-color:var(--acc);flex:none}
.cat-title{font-weight:600;font-size:16px;flex:1;min-width:0}
.badge{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:8px;flex:none;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.03em;line-height:1;color:var(--cat);background:var(--hov);border:1px solid var(--line2)}
@supports (background:color-mix(in srgb,red 10%,transparent)){.badge{background:color-mix(in srgb,var(--cat) 13%,transparent);border-color:color-mix(in srgb,var(--cat) 45%,transparent)}}
.badge.logo{padding:0}
.badge.logo svg{width:19px;height:19px;display:block}
.badge.logo.sm svg{width:12px;height:12px}
.badge.sm{min-width:24px;height:20px;padding:0 5px;border-radius:5px;font-size:10px;vertical-align:1px;margin-right:6px}
.cat-count{font-family:var(--mono);font-size:12px;color:var(--cat)}
.cat-meta{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.cat-topics{font-size:13px;color:var(--dim);line-height:1.5}
.mastery{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.bar{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cat,var(--acc));border-radius:3px}
.cat-card .btn{align-self:flex-start;margin-top:2px}

/* filters */
.filters{display:grid;gap:18px}
.f-row{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
.f-label{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-top:6px}
.f-body{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.f-group{display:flex;flex-direction:column;gap:6px;width:100%}
.f-group + .f-group{margin-top:6px}
.f-group-h{font-size:12.5px;color:var(--dim);display:flex;gap:10px;align-items:center}
.f-group-h button{background:none;border:0;padding:0;font-family:var(--mono);font-size:11px;color:var(--faint);cursor:pointer;text-decoration:underline}
.f-group-h button:hover{color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line2);background:transparent;color:var(--dim);border-radius:999px;padding:4px 11px;cursor:pointer;line-height:1.45;display:inline-flex;gap:6px;align-items:center}
.chip small{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.chip:hover{color:var(--fg);border-color:var(--faint)}
.chip.on{color:var(--fg);border-color:var(--acc);background:var(--accGlow)}
.chip.on small{color:var(--acc)}
.segctl{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.segctl button{border:0;border-right:1px solid var(--line2);background:transparent;color:var(--dim);font-size:13px;padding:6px 13px;cursor:pointer;font-variant-numeric:tabular-nums}
.segctl button:last-child{border-right:0}
.segctl button:hover{background:var(--hov);color:var(--fg)}
.segctl button[aria-pressed="true"]{background:var(--hov2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--acc)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--dim);cursor:pointer;padding:5px 0}
.toggle input{width:16px;height:16px;margin:0;accent-color:var(--acc)}
@media (max-width:700px){.f-row{grid-template-columns:1fr;gap:6px}.f-label{padding-top:0}}

/* sticky action bar (bottom of the stage) */
/* The action bar lives in the window frame, outside the scrolling stage, so it never scrolls away. */
.footbar{flex:0 0 auto}
.actionbar{background:var(--chrome2);border-top:1px solid var(--line)}
.ab-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media (min-width:700px){.ab-in{padding-left:clamp(20px,3.5vw,44px);padding-right:clamp(20px,3.5vw,44px)}}
.ab-in .sp{flex:1}
.ab-info{font-size:14px;color:var(--dim)}
.ab-info b{color:var(--fg);font-variant-numeric:tabular-nums}

/* resume banner */
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);background:var(--noteKey);border:1px solid var(--hiLine)}
.banner .sp{flex:1}
.banner b{font-weight:600}

/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--fg);background:var(--thBg);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
td{padding:9px 14px;border-bottom:1px solid var(--line);color:var(--dim);white-space:nowrap}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--fg)}
.linkish{background:none;border:0;padding:0;color:var(--acc2);cursor:pointer;font-size:13.5px;text-decoration:underline}

/* ---- question ---- */
.q-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-top .sp{flex:1}
.q-path{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cat,var(--acc))}
.pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.pill.easy{color:var(--str);border-color:var(--goodLine)}
.pill.medium{color:var(--type);border-color:var(--line2)}
.pill.hard{color:var(--err);border-color:var(--badLine)}
.pill.classic{color:var(--kw);border-color:var(--hiLine)}
.pill.imp3{color:var(--acc);border-color:var(--acc)}
.pill.imp1{border-style:dashed}
.q-timer{font-family:var(--mono);font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px;background:var(--inset);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.q-timer .g{color:var(--acc)}
.q-timer.frozen{color:var(--dim)}
.q-timer.frozen .g{color:var(--faint)}
.star{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--faint);cursor:pointer;font-size:16px;display:grid;place-items:center}
.star:hover{color:var(--fg)}
.star.on{color:var(--type);border-color:var(--type)}
.q-count{font-family:var(--mono);font-size:12px;color:var(--faint)}
.q-prompt{font-size:calc(clamp(19px,2.2vw,24px) * var(--fs));font-weight:600;line-height:1.4;letter-spacing:-.005em;max-width:68ch}
.q-prompt code{font-size:.8em}
.q-body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.q-body.single{grid-template-columns:minmax(0,1fr);max-width:820px}
@media (max-width:960px){.q-body{grid-template-columns:minmax(0,1fr)}}
.q-main{display:flex;flex-direction:column;gap:16px;min-width:0}

pre.code{margin:0;background:var(--inset);border:1px solid var(--line);border-radius:var(--r);padding:14px 0;overflow-x:auto;font-size:calc(13px * var(--fs));line-height:1.65;counter-reset:ln;color:var(--fg)}
pre.code code{display:block;min-width:max-content}
pre.code .ln{display:block;padding-right:18px}
pre.code .ln::before{counter-increment:ln;content:counter(ln);display:inline-block;width:40px;padding-right:16px;text-align:right;color:var(--chnum);user-select:none}
/* SYNTAX-CLASSES:START. Code colours by role; each theme sets the --syn-* values (see SYNTAX). */
.t-comment{color:var(--syn-comment)}.t-keyword{color:var(--syn-keyword)}.t-control{color:var(--syn-control)}.t-operator{color:var(--syn-operator)}.t-function{color:var(--syn-function)}.t-variable{color:var(--syn-variable)}.t-constVar{color:var(--syn-const-var)}.t-param{color:var(--syn-param)}.t-property{color:var(--syn-property)}.t-type{color:var(--syn-type)}.t-support{color:var(--syn-support)}.t-constant{color:var(--syn-constant)}.t-string{color:var(--syn-string)}.t-number{color:var(--syn-number)}.t-regexp{color:var(--syn-regexp)}.t-punct{color:var(--syn-punct)}.t-tag{color:var(--syn-tag)}.t-component{color:var(--syn-component)}.t-attr{color:var(--syn-attr)}
pre.code{background:var(--code-bg);color:var(--code-fg)}
pre.code .ln::before{color:var(--code-ln)}
/* SYNTAX-CLASSES:END */

.options{display:grid;gap:9px}
.opt{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;text-align:left;width:100%;padding:12px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-size:calc(14.5px * var(--fs));line-height:1.5}
.opt:hover:not(:disabled){background:var(--hov);border-color:var(--faint)}
.opt:disabled{cursor:default}
.opt .key{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line2);font-family:var(--mono);font-size:12px;font-weight:700;color:var(--dim)}
.opt .txt{padding-top:3px;min-width:0}
.opt .mark{font-family:var(--mono);font-size:11px;padding-top:6px;white-space:nowrap}
.opt.sel{border-color:var(--acc);background:var(--accGlow)}
.opt.sel .key{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.opt.correct{border-color:var(--goodLine);background:var(--goodBg)}
.opt.correct .key{background:var(--str);border-color:var(--str);color:var(--bg)}
.opt.correct .mark{color:var(--str)}
.opt.wrong{border-color:var(--badLine);background:var(--badBg)}
.opt.wrong .key{background:var(--err);border-color:var(--err);color:var(--bg)}
.opt.wrong .mark{color:var(--err)}

.answer-box{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line2);border-radius:var(--r);background:var(--inset);color:var(--fg);padding:12px 14px;font:calc(14px * var(--fs))/1.6 var(--sans)}
.answer-box::placeholder{color:var(--faint)}
.answer-box[readonly]{min-height:0;color:var(--dim)}
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}

.note{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--noteBg);font-size:calc(14.5px * var(--fs))}
.note.good{background:var(--goodBg);border-color:var(--goodLine)}
.note.bad{background:var(--badBg);border-color:var(--badLine)}
.note.warn{background:var(--noteWarn);border-color:var(--line2)}
.note .h{font-weight:600}
.note.good .h{color:var(--str)}.note.bad .h{color:var(--err)}.note.warn .h{color:var(--type)}
.prose{display:grid;gap:10px;font-size:calc(15px * var(--fs));line-height:1.65}
.prose p{max-width:72ch}
.model{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--acc2);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px}
.keypoints{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.keypoints li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:calc(14.5px * var(--fs))}
.keypoints li::before{content:"▸";color:var(--acc);font-family:var(--mono)}
.keypoints li.hit::before{content:"✓";color:var(--str)}
/* key-point checklist: tick what your answer covered */
.keypoints.kp-check li::before,.keypoints.kp-check li.hit::before{display:none}
.kp-check label{display:contents;cursor:pointer}
.kp-check input{width:16px;height:16px;margin:3px 0 0;accent-color:var(--str)}
.kp-check li.hit span{color:var(--fg)}
.kp-check li:not(.hit) span{color:var(--dim)}
.kp-sum{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:8px;letter-spacing:0;text-transform:none}
.rate button.suggest{outline:2px dashed var(--acc);outline-offset:2px}
.rate button.suggest small::after{content:" · suggested";color:var(--acc)}
.links{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.links a{color:var(--acc2);font-weight:500;font-size:14px;text-decoration:none;overflow-wrap:anywhere}
.links a:hover{text-decoration:underline}
.links a::after{content:" ↗";font-weight:400}
.links small{color:var(--faint);font-family:var(--mono);font-size:11px;margin-left:6px}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.rate button{flex:1 1 120px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;text-align:left}
.rate button b{font-size:14.5px}
.rate button small{font-size:12px;color:var(--dim)}
.rate button:hover{background:var(--hov)}
.rate button[data-v="got"][aria-pressed="true"]{border-color:var(--str);background:var(--goodBg)}
.rate button[data-v="partly"][aria-pressed="true"]{border-color:var(--type);background:var(--noteWarn)}
.rate button[data-v="missed"][aria-pressed="true"]{border-color:var(--err);background:var(--badBg)}
.paused{margin:auto;max-width:460px;text-align:center;display:grid;gap:14px;justify-items:center;padding:40px 20px}
.paused .big{font-family:var(--mono);font-size:40px;font-variant-numeric:tabular-nums;color:var(--type)}

/* ---- report ---- */
.res-head{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
@media (max-width:640px){.res-head{grid-template-columns:1fr;justify-items:start}}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;display:block;line-height:1}
.ring .lbl span{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.brk{display:grid;gap:9px}
.brk-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:13.5px}
.brk-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk-row .nm small{color:var(--faint);font-family:var(--mono);font-size:11px;margin-left:6px}
.brk-row .val{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.slow{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.slow li{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:14px;align-items:baseline}
.slow li b{font-family:var(--mono);color:var(--type);font-variant-numeric:tabular-nums}
.slow li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-group{display:grid;gap:10px}
.plan-group + .plan-group{margin-top:18px}
.plan-group h3{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:500}
.plan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:900px){.plan-grid{grid-template-columns:minmax(0,1fr)}}
.plan-item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.plan-item .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan-item h4{font-size:15px;font-weight:600;line-height:1.4}
.plan-item p{font-size:14px;color:var(--dim)}
.tag{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--line2)}
.tag.correct,.tag.got{color:var(--str);border-color:var(--goodLine);background:var(--goodBg)}
.tag.wrong,.tag.missed{color:var(--err);border-color:var(--badLine);background:var(--badBg)}
.tag.partly{color:var(--type);background:var(--noteWarn)}
.tag.skipped{color:var(--faint)}
.tag.new{color:var(--acc2);border-color:var(--line2)}
.rv{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.rv + .rv{margin-top:6px}
.rv summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:34px minmax(0,1fr) auto auto 64px;gap:12px;align-items:center;padding:11px 14px;font-size:14px}
.rv summary::-webkit-details-marker{display:none}
.rv summary:hover{background:var(--hov)}
.rv .n{font-family:var(--mono);font-size:12px;color:var(--faint)}
.rv .pq{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .tm{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.rv .tm.slowv{color:var(--type)}
.rv-body{padding:6px 18px 18px;border-top:1px solid var(--line);display:grid;gap:14px}
.rv.flash{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:700px){.rv summary{grid-template-columns:28px minmax(0,1fr) auto 50px}.rv summary .meta-pill{display:none}}
.report-text{width:100%;height:260px;font:12.5px/1.5 var(--mono);border:1px solid var(--line2);border-radius:8px;padding:10px;background:var(--inset);color:var(--fg);resize:vertical}

/* ---- status bar ---- */
.prog{height:2px;pointer-events:none}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s ease}
.status{display:flex;align-items:center;gap:16px;min-height:26px;flex:0 0 auto;padding:0 12px env(safe-area-inset-bottom,0px);background:var(--chrome);border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--dim);overflow:hidden}
.status .sp{flex:1}
.status .seg{display:flex;align-items:center;gap:6px;white-space:nowrap}
.status .seg.acc{color:var(--acc)}
.status kbd{font-size:10px;padding:0 4px}
@media (max-width:760px){.status .hide-s{display:none}}

/* ---- dialog & toast ---- */
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:16px}
.dialog{background:var(--panel);border:1px solid var(--line2);border-radius:12px;max-width:460px;width:100%;padding:22px;display:grid;gap:12px}
.dialog h3{font-size:17px}
.dialog p{color:var(--dim);font-size:14.5px}
.dialog .acts{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;z-index:60;max-width:calc(100vw - 32px)}
.empty{padding:34px 20px;text-align:center;color:var(--dim);display:grid;gap:12px;justify-items:center}

/* ---- browse / study ---- */
.search{width:100%;height:44px;padding:0 14px 0 40px;border-radius:var(--r);border:1px solid var(--line2);background:var(--inset) no-repeat 14px center;color:var(--fg);font:15px var(--sans)}
.search::placeholder{color:var(--faint)}
.searchbar{position:relative}
.searchbar::before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-52%);color:var(--faint);font-size:18px;pointer-events:none}
.bq-list{display:grid;gap:14px}
.bq{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:14px;min-width:0;border-top:2px solid var(--cat,var(--line))}
.bq-prompt{font-size:calc(17px * var(--fs));font-weight:600;line-height:1.45;max-width:72ch}
.bq-prompt code{font-size:.82em}
.more{justify-self:center;margin-top:4px}
.del{color:var(--err)}
td .linkish + .linkish{margin-left:12px}

/* ---- activity: streak + calendar ---- */
.act{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:760px){.act{grid-template-columns:minmax(0,1fr)}}
.act-nums{display:flex;gap:22px;flex-wrap:wrap}
.act-nums div{display:grid;gap:2px}
.act-nums b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.act-nums b.hot{color:var(--acc)}
.act-nums span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.cal-wrap{overflow-x:auto;scrollbar-width:thin;display:grid;gap:6px;justify-items:end}
.cal{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px}
.cal i{display:block;border-radius:2px;background:var(--line)}
.cal i.l1,.cal i.l2,.cal i.l3,.cal i.l4{background:var(--acc)}
.cal i.l1{opacity:.3}.cal i.l2{opacity:.55}.cal i.l3{opacity:.8}
.cal i.future{background:transparent}
.cal i.today{outline:1px solid var(--fg);outline-offset:1px}
.cal-key{display:flex;gap:3px;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.cal-key i{width:11px;height:11px;border-radius:2px;display:block;background:var(--acc)}

/* ---- settings ---- */
.select{height:36px;min-width:220px;max-width:100%;border:1px solid var(--line2);border-radius:8px;background:var(--inset);color:var(--fg);padding:0 10px;font:14px var(--sans);cursor:pointer}
.swatches{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.swatches i{width:22px;height:22px;border-radius:5px;border:1px solid var(--line2);display:block}
.set-note{font-size:13px;color:var(--faint);margin-top:6px;width:100%}
/* Appearance: controls on the left, a sticky live preview on the right. */
.appear{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.appear-main{display:grid;gap:22px;min-width:0;align-content:start}
.appear-pv{position:sticky;top:0;display:grid;gap:8px;max-height:calc(100vh - 150px);overflow:auto;scrollbar-width:thin;min-width:0}
@media (max-width:1000px){.appear{grid-template-columns:minmax(0,1fr)}.appear-pv{position:static;order:-1;max-height:none}}
.toggle span code{white-space:nowrap}
.preview{width:100%;border:1px dashed var(--line2);border-radius:var(--r);background:var(--bg);padding:14px;display:grid;gap:12px}
.preview .q-prompt{font-size:calc(16px * var(--fs))}
.preview .q-body{grid-template-columns:minmax(0,1fr);gap:12px}
.preview .opt{padding:8px 12px}
.preview .acts{display:flex;gap:10px;flex-wrap:wrap}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 22px}
.keys div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--dim)}
.keys kbd{font-size:11px}
.keys h4{grid-column:1/-1;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:500;margin-top:8px}

/* ---- print: light paper colours whatever the screen theme, no app chrome ---- */
@media print{
  :root:not(#print),:root[data-theme]:not(#print){
    color-scheme:light;
    --bg:#FFFFFF; --panel:#FFFFFF; --inset:#F4F6F9; --chrome:#EAEDF2; --chrome2:#E3E7EE;
    --line:#D5DBE3; --line2:#BFC8D4;
    --fg:#111821; --dim:#3F4956; --faint:#5A6474;
    --kw:#7A2FA0; --fn:#1A55B0; --str:#1F5C24; --num:#9A3D10; --type:#765300; --err:#B0281C; --cy:#0B6278;
    --acc:#9A3D10; --acc2:#1A55B0;
    --hov:#F1F3F7; --hov2:#E8ECF2; --capbg:#F1F3F7; --icBg:#F1F3F7; --thBg:#EEF1F5; --kbdBg:#EEF1F5;
    --hiBg:#FAF5FD; --hiLine:#E0CEEB;
    --badBg:#FDF3F2; --badLine:#E7C3BF; --goodBg:#F0F7F1; --goodLine:#BFD9C3;
    --noteBg:#F2F6FC; --noteWarn:#FCF4EC; --noteGood:#F0F7F1; --noteKey:#FAF5FD;
    --mmDiv:#AFB8C5; --chnum:#9AA4B2;
    --scrim:rgba(255,255,255,.95); --accGlow:rgba(154,61,16,.08);
  }
  html,body{height:auto;overflow:visible;background:#fff}
  body{font-size:12.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ide,.body{display:block;height:auto}
  .stage{display:block;overflow:visible}
  .titlebar,.tabs,.status,.footbar,.toast,.scrim,[role="tablist"],.linkish{display:none!important}
  .page{max-width:none;padding:0;animation:none;gap:18px}
  .stats,.panel,.plan-item,.brk-row,.res-head{break-inside:avoid}
  .rv{break-inside:auto}
  .rv summary{break-after:avoid}
  pre.code{overflow:visible;white-space:pre-wrap}
  pre.code code{min-width:0}
  .links a::after{content:" (" attr(href) ")";font-size:10px;color:var(--faint)}
  h1.t{font-size:22px}
}

<script>
// ============================================================
// Registry. Each category is one registerCategory({...}) call in
// the BANK region below. See README.md for the question schema.
// ============================================================
// APP:START — everything topic-specific about this bank. Fill these in.
const APP = {
  title: "Interview Question Bank",                 // page heading and backup name, e.g. "Interview Question Bank"
  slug: "interview-bank",                   // lowercase-dashes; namespaces storage and backups, e.g. "interview-bank"
  lead: "The interview questions you’re most likely to be asked about **JavaScript, React, Next.js, Testing, TypeScript, CSS & HTML, the browser and web performance, and frontend system design**.",                   // one or two sentences under the heading; may use **bold** and `code`
  keyPointsLabel: "What the interviewer listens for", // heading above an open answer's key points, e.g. "What the interviewer listens for"
  storagePrefix: "qb-",   // optional; "" means "<slug>:". Only set it to keep an older bank's saved progress.
};
// APP:END

const CATEGORIES = [];
const Q = new Map();
const ACCENTS = ["--fn", "--kw", "--str", "--type", "--cy", "--num"];
// A category's badge: its own `badge` (up to 4 characters), or initials from its title.
const STOP = new Set(["and", "the", "of", "for", "to", "in", "a", "an"]);
function badgeText(c) {
  if (typeof c.badge === "string" && c.badge.trim()) return c.badge.trim().slice(0, 4);
  const words = String(c.title).split(/[^A-Za-z0-9]+/).filter((w) => w && !STOP.has(w.toLowerCase()));
  if (!words.length) return "?";
  return (words.length === 1 ? words[0].slice(0, 2) : words.slice(0, 3).map((w) => w[0]).join("")).toUpperCase();
}
const badge = (c, sm) => c.icon
  ? `<span class="badge logo${sm ? " sm" : ""}" aria-hidden="true">${c.icon}</span>`
  : `<span class="badge${sm ? " sm" : ""}" aria-hidden="true">${esc(badgeText(c))}</span>`;

// Brand colours keep their hue but get a lightness that reads on the current theme:
// at least 4.5:1 against --bg and --panel, recomputed when the theme or mode changes.
const hexRgb = (h) => { h = String(h).trim().replace("#", ""); if (h.length === 3) h = h.split("").map((x) => x + x).join(""); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const lum = ([r, g, b]) => { const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }; return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); };
const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
function rgbHsl([r, g, b]) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1));
  const h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [(h * 60 + 360) % 360, s, l];
}
function hslRgb([h, s, l]) {
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
  const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return [r, g, b].map((v) => Math.round((v + m) * 255));
}
function readable(brand, grounds) {
  const dark = lum(grounds[0]) < 0.2;
  let hsl = rgbHsl(hexRgb(brand)), rgb = hexRgb(brand);
  for (let i = 0; i < 60 && grounds.some((g) => ratio(rgb, g) < 4.5); i++) {
    hsl = [hsl[0], hsl[1], Math.max(0, Math.min(1, hsl[2] + (dark ? 0.02 : -0.02)))];
    rgb = hslRgb(hsl);
  }
  return "#" + rgb.map((v) => v.toString(16).padStart(2, "0")).join("");
}
function applyBrandColors() {
  if (typeof getComputedStyle !== "function") return;
  const cs = getComputedStyle(document.documentElement);
  const grounds = ["--bg", "--panel"].map((v) => cs.getPropertyValue(v)).filter((v) => /^s*#/.test(v)).map(hexRgb);
  if (!grounds.length) return;
  for (const c of CATEGORIES) if (c.brand && c.accent.startsWith("--cat-")) document.documentElement.style.setProperty(c.accent, readable(c.brand, grounds));
}
const DIFFS = ["easy", "medium", "hard"];
// Importance (references/importance-guide.md): how likely an interview asks it. Optional;
// when no question in the bank has it, the Classics filter shows instead.
const IMPS = [[3, "Must know"], [2, "Common"], [1, "Deep cut"]];
const impOf = (q) => ([1, 2, 3].includes(q.importance) ? q.importance : 0);
let impKnown = null;
const hasImp = () => (impKnown ??= [...Q.values()].some(impOf));
function qPills(q) {
  const v = impOf(q);
  if (v) return `<span class="pill imp${v}" title="How likely an interview asks this">${IMPS.find((x) => x[0] === v)[1].toLowerCase()}</span>`;
  return q.classic && !hasImp() ? '<span class="pill classic">classic</span>' : "";
}

function checkQuestion(q, cat) {
  if (!q || typeof q.id !== "string" || !q.id) return "missing id";
  if (Q.has(q.id)) return "duplicate id";
  if (!cat.topics[q.topic]) return `unknown topic "${q.topic}"`;
  if (!DIFFS.includes(q.difficulty)) return `bad difficulty "${q.difficulty}"`;
  if (typeof q.prompt !== "string" || !q.prompt) return "missing prompt";
  if (q.type === "mcq") {
    if (!Array.isArray(q.options) || q.options.length < 2 || q.options.length > 9) return "mcq needs 2-9 options";
    if (!Number.isInteger(q.answer) || q.answer < 0 || q.answer >= q.options.length) return "answer index out of range";
  } else if (q.type === "open") {
    if (typeof q.answer !== "string" || !q.answer) return "open question needs an answer";
  } else return `unknown type "${q.type}"`;
  return null;
}

function registerCategory(cat) {
  if (!cat || !cat.id || !cat.title || !cat.topics || !Array.isArray(cat.questions)) {
    console.error("registerCategory: a category needs id, title, topics and questions", cat);
    return;
  }
  if (CATEGORIES.some((c) => c.id === cat.id)) {
    console.error(`registerCategory: category "${cat.id}" is registered twice`);
    return;
  }
  if (typeof cat.brand === "string" && /^#[0-9a-f]{6}$/i.test(cat.brand)) {
    cat.accent = "--cat-" + String(cat.id).replace(/[^a-z0-9_-]/gi, "");
    document.documentElement.style.setProperty(cat.accent, cat.brand);
  } else cat.accent = cat.accent || ACCENTS[CATEGORIES.length % ACCENTS.length];
  const kept = [], problems = [];
  for (const q of cat.questions) {
    const p = checkQuestion(q, cat);
    if (p) { problems.push(`  ${(q && q.id) || "(no id)"}: ${p}`); continue; }
    q.cat = cat.id;
    q.keyPoints = q.keyPoints || [];
    q.links = q.links || [];
    Q.set(q.id, q);
    kept.push(q);
  }
  cat.questions = kept;
  CATEGORIES.push(cat);
  if (problems.length) console.warn(`registerCategory("${cat.id}"): skipped ${problems.length} question(s)\n${problems.join("\n")}`);
}

/* BANK:START */

  brand: "#F7DF1E",
  topics: {

      answer: "`undefined` means a value was never assigned: an uninitialized variable, a missing object property, a missing function argument, or a function with no `return`. `null` is an explicit, intentional empty value that a developer assigns to say there is no object here.\n\nThey are different types: `typeof undefined` is `'undefined'`, while `typeof null` is `'object'` because of a historic bug. They are loosely equal (`null == undefined` is true) but not strictly equal. In practice `x == null` is a common shorthand to check for both, and `??` and `?.` treat both as missing. Default parameters only kick in for `undefined`, not `null`, and `JSON.stringify` drops `undefined` properties but keeps `null`.",

      answer: "When a value is used in a boolean context (an `if`, `&&`, `||`, `!`, a ternary), JavaScript converts it to a boolean. Values that convert to `false` are falsy and everything else is truthy.\n\nThe falsy values are: `false`, `0`, `-0`, `0n` (BigInt zero), `''` (empty string), `null`, `undefined`, and `NaN`. That is the whole list (plus the legacy `document.all` in browsers).\n\nCommon surprises: `'0'`, `'false'`, `' '`, `[]`, `{}` and `new Boolean(false)` are all truthy, because non-empty strings and all objects are truthy. This is why `if (arr.length)` is fine but `if (arr)` does not check for an empty array, and why `count || 10` wrongly replaces a valid `0`.",

      answer: "Authentication usually stores a session in an encrypted, `httpOnly` cookie, either a stateless signed token or an ID pointing to a database session. Libraries such as Auth.js or a hosted provider handle much of this.\n\nFor protection, use layers. Middleware can do fast, optimistic checks, such as redirecting to `/login` when there is no session cookie. The real check belongs in a data access layer: a `verifySession()` function, wrapped in React `cache()`, that every data read, Server Action and Route Handler calls before touching data.\n\nDon't rely on layouts for auth checks either, because layouts don't re-render on every navigation. Checking close to the data means a bypassed middleware or a forgotten page check doesn't expose anything.",

import "server-only";
import { cache } from "react";
import { cookies } from "next/headers";
import { redirect } from "next/navigation";

export const verifySession = cache(async () => {
  const token = (await cookies()).get("session")?.value;
  const session = await decrypt(token);
  if (!session?.userId) redirect("/login");
  return { userId: session.userId };
});`,

      id: "test-strategy-01", type: "open", topic: "strategy", difficulty: "easy", classic: true, importance: 3,
      prompt: "Explain the difference between unit, integration and end-to-end tests. How would you balance them in a React app?",
      answer: "A **unit test** checks one small piece in isolation, such as a utility function, a reducer or a custom hook. An **integration test** checks several pieces working together, for example a form component with its validation, child components and a mocked network layer. An **end-to-end test** drives the real app in a real browser, usually against a running backend, the way a user would.\n\nMoving up that list, tests get slower and more expensive to maintain, but they give more confidence that the app actually works. In a React app I write most tests as integration tests with React Testing Library, rendering a feature and interacting with it like a user. I add unit tests for tricky pure logic, and a small set of E2E tests with Playwright for the critical journeys such as sign-up, login and checkout.",

      answer: "The **testing pyramid** says to write many fast unit tests at the base, fewer integration tests in the middle and very few slow E2E tests at the top. It optimises for speed and cost.\n\nThe **testing trophy**, popularised by Kent C. Dodds, has four layers: static analysis (TypeScript, ESLint) at the base, then unit tests, then a large integration layer, then a small E2E layer on top. The biggest part is integration.\n\nFrontend teams like the trophy because most UI bugs live in how components, state and data fetching fit together, which isolated unit tests miss. Tools like Testing Library and MSW have made integration tests almost as fast as unit tests, so you get more confidence per test. The idea behind both shapes is the same: pick the cheapest test that gives you real confidence.",

      prompt: "What is TDD (test-driven development)? Describe the red, green, refactor cycle.",
      answer: "TDD means writing a failing test before the code that makes it pass. You work in short cycles.\n\n**Red**: write a small test for the next bit of behaviour and watch it fail. Seeing it fail proves the test can catch the missing behaviour. **Green**: write the simplest code that makes the test pass, even if it is not pretty. **Refactor**: clean up the code and the test while the tests stay green, then repeat.\n\nThe benefits are a design driven by how the code is used, a safety net that grows with the code, and fewer untested paths. It works especially well for pure logic, bug fixes (write a test that reproduces the bug first) and reducers. For UI exploration many people write tests just after the code instead, which is fine as long as the tests exist.",

      answer: "Enzyme's shallow rendering renders one component without rendering its children, and its API lets you read component state, props of child components and instance methods. That makes tests check how a component is built rather than what the user sees. Refactoring a class to hooks, or splitting a component, breaks the tests even when the behaviour is unchanged, and a shallow test can pass while the real tree is broken.\n\nReact Testing Library renders the full tree into a real DOM (jsdom) and only gives you DOM queries, mainly by role, label and text. You interact through events like a user. Tests are therefore resilient to refactors and catch integration bugs between parent and child. Enzyme also never got an official adapter for React 18, which pushed teams to switch.",

      answer: "`getBy*` returns the matching element synchronously and **throws** if there is no match or more than one. Use it for elements that should be there right now. The thrown error prints the DOM, which helps debugging.\n\n`queryBy*` returns `null` when nothing matches (it still throws on multiple matches). Use it only to assert that something is **not** present, e.g. `expect(screen.queryByRole('alert')).not.toBeInTheDocument()`.\n\n`findBy*` returns a **promise**. It is `getBy*` wrapped in `waitFor`, retrying until the element appears or the timeout (1000ms by default) passes. Use it for elements that appear after async work, such as data loading.\n\nEach has an `All` variant (`getAllBy*`, `queryAllBy*`, `findAllBy*`) that returns an array for multiple matches.",

      answer: "**Lab data** comes from a controlled test: Lighthouse or the DevTools Performance panel loading a page on a fixed device, network and location. It is reproducible and good for debugging and catching regressions before release.\n\n**Field data** (real user monitoring, RUM) is collected from real visitors, for example by the Chrome UX Report or your own `web-vitals` script. It reflects real devices, networks, caches, locations and user behaviour, and it is what Google uses to assess Core Web Vitals, at the 75th percentile.\n\nThey disagree because a lab test is one load of one page under one set of conditions, usually with a cold cache and no interactions. Lighthouse can't measure INP because nobody interacts, so it uses Total Blocking Time as a proxy. Use field data to find problems and lab tools to diagnose them.",

  const box = document.getElementById("open-text");
  if (box) a.text = box.value;
  stopQuestionClock(q.id);
  a.revealed = true;
  saveSession();
  render();
}
function rate(v) {
  const q = Q.get(curId()), a = ans(q.id);
  if (q.type !== "open" || !a.revealed || session.paused) return;
  if (a.result) {
    // Changing a rating: update the stored result without counting another attempt.
    a.result = v;
    logEntry(q.id, session.id).r = v;
    saveStats();
    saveSession();
  } else finalize(q.id, v);
  render();
}
// Key-point checklist: after revealing an open answer, tick what you covered.
// The ticked share suggests a rating; the user still picks it.
function kpSuggest(covered, total) {
  if (!total) return null;
  const r = covered / total;
  return r >= 0.8 ? "got" : r >= 0.4 ? "partly" : "missed";
}
function toggleKeyPoint(i) {
  const q = Q.get(curId()), a = ans(q.id);
  if (q.type !== "open" || !a.revealed || session.paused || i < 0 || i >= q.keyPoints.length) return;
  a.kp = a.kp || [];
  const at = a.kp.indexOf(i);
  at >= 0 ? a.kp.splice(at, 1) : a.kp.push(i);
  saveSession();
  render();
}
function skip() {
  const a = ans(curId());
  if (a.result || session.paused) return;
  if (a.revealed) return toast("Rate yourself instead of skipping");
  finalize(curId(), "skipped");
  nextOrFinish();
}
function nextOrFinish() {
  if (session.idx < session.ids.length - 1) goTo(session.idx + 1);
  else confirmEnd(true);
}
async function confirmEnd(atEnd = false) {
  const left = session.ids.filter((id) => !session.answers[id]?.result).length;
  const ok = atEnd && !left ? true : await dialog({
    title: "End this session?",
    body: left ? `${plural(left, "question")} not answered yet. The report only includes the ones you answered or skipped.` : "You’ll see your report next.",
    ok: "End session",
    cancel: "Keep going",
  });
  if (ok && session) endSession();
}
function toggleMark(id) {
  marks.has(id) ? marks.delete(id) : marks.add(id);
  saveMarks();
  toast(marks.has(id) ? "Bookmarked" : "Bookmark removed");
  render();
}

function searchText(q) {
  if (!q._text) q._text = [q.prompt, q.code, q.explain, typeof q.answer === "string" ? q.answer : "", ...(q.options || []), ...q.keyPoints, catOf(q).title, topicName(q)]

  return q._text;
}
function browseIds() {
  const words = browseQuery.toLowerCase().split(/\s+/).filter(Boolean);

  return words.length ? ids.filter((id) => { const t = searchText(Q.get(id)); return words.every((w) => t.includes(w)); }) : ids;
}

function renderSession() {
  if (session.paused) {
    return { main: `<div class="page"><div class="paused">
      <div class="eyebrow">Paused</div>
      <div class="big">${mmss(sessMs(session))}</div>
      <p class="muted">${esc(session.label)} · question ${session.idx + 1} of ${session.ids.length}. The question is hidden while you’re paused, and neither clock is running.</p>
      <button class="btn primary" data-act="resume">Resume <kbd>Space</kbd></button>
      <button class="linkish" data-act="end">End session and see the report</button>
    </div></div>`, actions: "" };
  }
  const q = Q.get(curId()), a = ans(q.id), c = catOf(q);
  const final = !!a.result;
  const frozen = final || a.revealed;
  const n = session.ids.length, last = session.idx === n - 1;

  let interact = "";
  if (q.type === "mcq") {
    const perm = session.optOrder[q.id] || range(q.options.length);
    interact = `<div class="options" role="radiogroup" aria-label="Answers">${perm.map((oi, di) => {
      let cls = "", mark = "";
      if (final) {
        if (oi === q.answer) { cls = "correct"; mark = oi === a.choice ? "your answer ✓" : "correct answer"; }
        else if (oi === a.choice) { cls = "wrong"; mark = "your answer"; }
      } else if (oi === a.choice) cls = "sel";
      return `<button class="opt ${cls}" role="radio" aria-checked="${oi === a.choice}" data-act="opt" data-i="${di}" ${final ? "disabled" : ""}>
        <span class="key">${di < 9 ? di + 1 : ""}</span><span class="txt">${fmt(q.options[oi])}</span><span class="mark">${mark}</span></button>`;
    }).join("")}</div>`;
    if (final) {
      const ok = a.result === "correct";
      interact += `<div class="note ${ok ? "good" : "bad"}"><span class="h">${ok ? "Correct" : "Not quite"}</span> <span class="muted">· answered in ${secs(a.ms)}</span></div>
        <div class="model"><div class="label">Why</div><div class="prose">${fmtBlock(q.explain || "")}</div>${q.links.length ? `<div><div class="label">Read more</div>${linkList(q.links)}</div>` : ""}</div>`;
    }
  } else {
    interact = `<div><div class="label">Your answer${a.revealed ? "" : " (optional)"}</div>
      <textarea class="answer-box" id="open-text" placeholder="Type your answer, or say it out loud, then reveal the model answer." ${a.revealed ? "readonly" : ""}>${esc(a.text || "")}</textarea></div>`;
    if (a.revealed) {
      const kp = a.kp || [], nk = q.keyPoints.length;
      // Suggest a rating once the checklist has been touched.
      const sug = a.kp ? kpSuggest(kp.length, nk) : null;
      const rateBtn = (v, label, key, hint) =>
        `<button data-act="rate" data-v="${v}" aria-pressed="${a.result === v}" class="${sug === v ? "suggest" : ""}"><b>${label} <kbd>${key}</kbd></b><small>${hint}</small></button>`;
      interact += `<div class="model">
          <div><div class="label">Model answer</div><div class="prose">${fmtBlock(q.answer)}</div></div>
          ${nk ? `<div><div class="label">${esc(APP.keyPointsLabel)}<span class="kp-sum">tick what you covered · ${kp.length}/${nk}</span></div>
            <ul class="keypoints kp-check">${q.keyPoints.map((k, i) => `<li class="${kp.includes(i) ? "hit" : ""}"><label><input type="checkbox" data-change="kp" data-i="${i}" ${kp.includes(i) ? "checked" : ""} aria-label="Covered: ${esc(k.replace(/`/g, ""))}"><span>${fmt(k)}${i < 9 ? ` <kbd>${i + 1}</kbd>` : ""}</span></label></li>`).join("")}</ul></div>` : ""}
          ${q.links.length ? `<div><div class="label">Read more</div>${linkList(q.links)}</div>` : ""}
        </div>
        <div><div class="label">How did you do? · thinking time ${secs(a.ms)}</div>
        <div class="rate" role="group" aria-label="Rate your answer">
          ${rateBtn("got", "Got it", "G", "Covered the key points")}
          ${rateBtn("partly", "Partly", "P", "Missed something important")}
          ${rateBtn("missed", "Missed", "M", "Didn’t know it")}
        </div></div>`;
    }
  }

  let primary;
  if (q.type === "mcq" && !final) primary = `<button class="btn primary" data-act="primary" ${a.choice == null ? "disabled" : ""}>Check answer <kbd>Enter</kbd></button>`;
  else if (q.type === "open" && !a.revealed) primary = `<button class="btn primary" data-act="primary">Reveal answer <kbd>Space</kbd></button>`;
  else if (!final) primary = `<button class="btn primary" disabled>Rate yourself to continue</button>`;
  else primary = `<button class="btn primary" data-act="primary">${last ? "Finish session" : "Next question →"} <kbd>Enter</kbd></button>`;

  const hasCode = !!q.code;
  return { main: `<div class="page" style="--cat:var(${c.accent})">
    <div class="q-top">
      <span class="q-path">${badge(c, true)}${esc(c.title)} › ${esc(topicName(q))}</span>
      <span class="pill ${q.difficulty}">${q.difficulty}</span>
      ${qPills(q)}
      <span class="pill">${q.type === "mcq" ? "multiple choice" : "open answer"}</span>
      <span class="sp"></span>
      <span class="q-timer ${frozen ? "frozen" : ""}" title="${frozen ? "Time you spent on this question" : "Time on this question"}"><span class="g">⏱</span><b id="q-time">${mmss(qMs(session, q.id))}</b></span>
      <button class="star ${marks.has(q.id) ? "on" : ""}" data-act="mark" aria-pressed="${marks.has(q.id)}" title="Bookmark (B)" aria-label="Bookmark this question">★</button>
    </div>
    <div class="q-count">Question ${session.idx + 1} of ${n}</div>
    <h1 class="q-prompt">${fmt(q.prompt)}</h1>
    <div class="q-body ${hasCode ? "" : "single"}">
      ${hasCode ? `<div class="q-main">${codeBlock(q)}</div>` : ""}
      <div class="q-main">${interact}</div>
    </div>
  </div>`, actions: `<div class="actionbar"><div class="ab-in">
    <button class="btn ghost sm" data-act="prev" ${session.idx === 0 ? "disabled" : ""}>← Previous</button>
    ${final || a.revealed ? "" : `<button class="btn ghost sm" data-act="skip">Skip <kbd>S</kbd></button>`}
    <span class="sp"></span>
    <button class="btn ghost sm" data-act="end">End session</button>
    ${primary}
  </div></div>` };
}

function summarize(s) {
  const done = s.ids.filter((id) => s.answers[id]?.result);
  const scored = done.filter((id) => s.answers[id].result !== "skipped");
  const points = done.reduce((t, id) => t + RESULTS[s.answers[id].result].score, 0);
  const pct = done.length ? Math.round((points / done.length) * 100) : 0;
  const totalQ = done.reduce((t, id) => t + (s.answers[id].ms || 0), 0);
  const avg = done.length ? totalQ / done.length : 0;
  return { done, scored, points, pct, avg };
}
function bucket(s, ids, keyFn) {
  const m = new Map();
  for (const id of ids) {
    const k = keyFn(Q.get(id));
    const b = m.get(k) || { n: 0, pts: 0 };
    b.n++;
    b.pts += RESULTS[s.answers[id].result].score;
    m.set(k, b);
  }
  return [...m].map(([k, b]) => ({ k, n: b.n, pct: Math.round((b.pts / b.n) * 100) }));
}
function ring(pct) {
  const r = 56, c = 2 * Math.PI * r;
  return `<div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true">
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/>
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--acc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}"/>
  </svg><div class="lbl"><div><b>${pct}%</b><span>score</span></div></div></div>`;
}

function renderReport() {
  const s = report;
  if (!s) return { actions: "", main: `<div class="page"><div class="empty"><div class="eyebrow">No report yet</div><p>Finish a session and its report appears here.</p><button class="btn primary" data-act="to-library">Go to the library</button></div></div>` };
  const r = summarize(s);
  if (!r.done.length) return { actions: "", main: `<div class="page"><div class="empty"><div class="eyebrow">Nothing answered</div><p>This session ended before any question was answered or skipped.</p><button class="btn primary" data-act="to-library">Back to the library</button></div></div>` };

  const res = (id) => s.answers[id].result;
  const count = (k) => r.done.filter((id) => res(id) === k).length;
  const slowest = r.done.filter((id) => res(id) !== "skipped").sort((x, y) => s.answers[y].ms - s.answers[x].ms).slice(0, 3);
  const slowLimit = Math.max(r.avg * 1.5, 30000);
  const byCat = bucket(s, r.done, (q) => q.cat);
  const byTopic = bucket(s, r.done, (q) => `${q.cat}:${q.topic}`).sort((a, b) => a.pct - b.pct || b.n - a.n);
  const misses = r.done.filter((id) => WEAK.includes(res(id)) || res(id) === "skipped");
  const retry = misses.length;
  const brkRow = (name, sub, pct, n, accent) => `<div class="brk-row" style="--cat:var(${accent})">
      <span class="nm">${esc(name)}${sub ? `<small>${esc(sub)}</small>` : ""}</span>
      <div class="bar"><i style="width:${pct}%"></i></div><span class="val">${pct}% · ${n}</span></div>`;

  // study plan grouped by topic
  const groups = new Map();
  for (const id of misses) {
    const q = Q.get(id), k = `${q.cat}:${q.topic}`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(id);
  }
  const plan = [...groups].map(([k, ids]) => {
    const q0 = Q.get(ids[0]), c = catOf(q0);
    return `<div class="plan-group"><h3>${esc(c.title)} › ${esc(c.topics[q0.topic])} · ${ids.length} to review</h3>
      <div class="plan-grid">${ids.map((id) => {
        const q = Q.get(id);
        return `<article class="plan-item">
          <div class="top"><span class="tag ${res(id)}">${RESULTS[res(id)].label}</span><span class="pill ${q.difficulty}">${q.difficulty}</span></div>
          <h4>${fmt(q.prompt)}</h4>
          <p>${fmt(firstSentence(q.type === "mcq" ? q.explain || "" : q.answer))}</p>
          ${linkList(q.links)}
          <button class="linkish" data-act="goto" data-id="${esc(id)}" style="justify-self:start">See the full answer</button>
        </article>`;
      }).join("")}</div></div>`;
  }).join("");

  return { main: `<div class="page">
    <section class="res-head">
      ${ring(r.pct)}
      <div>
        <div class="eyebrow">Session report</div>
        <h1 class="t">${esc(s.label)}</h1>
        <p class="lead">${new Date(s.startedAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })} · ${r.done.length} of ${s.ids.length} questions answered or skipped. Open answers score 1 for Got it and 0.5 for Partly.</p>
      </div>
    </section>
    <div class="stats">
      <div class="stat"><div class="k">Total time</div><div class="v">${mmss(s.elapsed)}</div></div>
      <div class="stat"><div class="k">Avg / question</div><div class="v">${secs(r.avg)}</div></div>
      <div class="stat"><div class="k">Correct / got it</div><div class="v">${count("correct") + count("got")}</div></div>
      <div class="stat"><div class="k">Partly</div><div class="v">${count("partly")}</div></div>
      <div class="stat"><div class="k">Wrong / missed</div><div class="v">${count("wrong") + count("missed")}</div></div>
      <div class="stat"><div class="k">Skipped</div><div class="v">${count("skipped")}</div></div>
    </div>

    <div class="grid2">
      <section class="panel" style="display:grid;gap:14px">
        <div class="section-h"><h2>By category</h2></div>
        <div class="brk">${byCat.map((b) => { const c = CATEGORIES.find((x) => x.id === b.k); return brkRow(c.title, "", b.pct, b.n, c.accent); }).join("")}</div>
        <div class="section-h" style="margin-top:6px"><h2>Slowest questions</h2></div>
        <ol class="slow">${slowest.map((id) => `<li><b>${secs(s.answers[id].ms)}</b><span>${esc(Q.get(id).prompt.replace(/`/g, ""))}</span></li>`).join("") || '<li class="muted">None</li>'}</ol>
      </section>
      <section class="panel" style="display:grid;gap:14px;align-content:start">
        <div class="section-h"><h2>By topic</h2><span class="hint">weakest first</span></div>
        <div class="brk">${byTopic.map((b) => { const [cid, t] = b.k.split(":"); const c = CATEGORIES.find((x) => x.id === cid); return brkRow(c.topics[t], c.title, b.pct, b.n, c.accent); }).join("")}</div>
      </section>
    </div>

    <section style="display:grid;gap:12px">
      <div class="section-h"><h2>Study plan</h2><span class="hint">${misses.length ? `${plural(misses.length, "question")} to review` : ""}</span></div>
      ${misses.length ? `<p class="muted" style="max-width:72ch">Everything you got wrong, only partly knew, missed or skipped, grouped by topic. Each one links to the docs that cover it.</p>${plan}`
        : `<div class="note good"><span class="h">Nothing to review.</span> Every question in this session was correct or rated Got it.</div>`}
    </section>

    <section style="display:grid;gap:12px">
      <div class="section-h"><h2>Every question</h2>
        <div class="chips" role="tablist">${[["all", "All"], ["wrong", "Needs review"], ["slow", "Slow"]].map(([k, l]) =>
          `<button class="chip ${reviewFilter === k ? "on" : ""}" data-act="rfilter" data-f="${k}" role="tab" aria-selected="${reviewFilter === k}">${l}</button>`).join("")}</div>
      </div>
      <div id="review">${renderReview(s, slowLimit)}</div>
    </section>
  </div>`, actions: `<div class="actionbar"><div class="ab-in">
    ${CAN_PRINT ? `<button class="btn ghost sm" data-act="print">Print / save as PDF</button>` : ""}
    <button class="btn ghost sm" data-act="copy-report">Copy report as Markdown</button>
    <button class="btn ghost sm del" data-act="del-report" data-id="${esc(s.id)}">Delete report</button>
    <span class="sp"></span>
    <button class="btn sm" data-act="to-library">New session</button>
    ${retry ? `<button class="btn primary" data-act="retry">Retry ${plural(retry, "question")} to review →</button>` : ""}
  </div></div>` };
}

function renderReview(s, slowLimit) {
  const ids = s.ids.filter((id) => s.answers[id]?.result).filter((id) => {
    const r = s.answers[id].result;
    if (reviewFilter === "wrong") return r !== "correct" && r !== "got";
    if (reviewFilter === "slow") return s.answers[id].ms >= slowLimit;
    return true;
  });
  if (!ids.length) return `<div class="panel muted">Nothing here.</div>`;
  return ids.map((id) => {
    const q = Q.get(id), a = s.answers[id], c = catOf(q), num = s.ids.indexOf(id) + 1;
    let body = `<h3 class="q-prompt" style="font-size:17px;margin-top:10px">${fmt(q.prompt)}</h3>${q.code ? codeBlock(q) : ""}`;
    if (q.type === "mcq") {
      body += `<div class="options">${q.options.map((o, oi) => {
        const cls = oi === q.answer ? "correct" : oi === a.choice ? "wrong" : "";
        const mark = oi === q.answer ? (oi === a.choice ? "your answer ✓" : "correct answer") : oi === a.choice ? "your answer" : "";
        return `<div class="opt ${cls}" style="cursor:default"><span class="key">${oi + 1}</span><span class="txt">${fmt(o)}</span><span class="mark">${mark}</span></div>`;
      }).join("")}</div><div class="model"><div class="label">Why</div><div class="prose">${fmtBlock(q.explain || "")}</div>${linkList(q.links)}</div>`;
    } else {
      body += `${a.text ? `<div><div class="label">Your answer</div><div class="prose muted">${fmtBlock(a.text)}</div></div>` : ""}
        <div class="model"><div class="label">Model answer</div><div class="prose">${fmtBlock(q.answer)}</div>
        ${q.keyPoints.length ? `${a.kp ? `<div class="label">Key points covered: ${a.kp.length}/${q.keyPoints.length}</div>` : ""}<ul class="keypoints">${q.keyPoints.map((k, i) => `<li class="${a.kp && a.kp.includes(i) ? "hit" : ""}"><span>${fmt(k)}</span></li>`).join("")}</ul>` : ""}${linkList(q.links)}</div>`;
    }
    return `<details class="rv" id="rv-${esc(id)}">
      <summary><span class="n">${num}</span><span class="pq">${fmt(q.prompt)}</span>
        <span class="pill meta-pill" style="color:var(${c.accent})">${esc(c.title)} · ${esc(c.topics[q.topic])}</span>
        <span class="tag ${a.result}">${RESULTS[a.result].label}${a.kp && q.keyPoints.length ? ` · ${a.kp.length}/${q.keyPoints.length}` : ""}</span>
        <span class="tm ${a.ms >= slowLimit ? "slowv" : ""}">${a.result === "skipped" && !a.ms ? "–" : secs(a.ms)}</span></summary>
      <div class="rv-body">${body}</div>
    </details>`;
  }).join("");
}

// A sample question built from the real components, so it shows the theme exactly
// as a session will look. It's inert: nothing in it can be clicked or focused.
// The code uses => === !== >= && ** ++ ?? so the ligatures setting shows.
const PREVIEW_CODE = [
  "// Retry with exponential backoff",
  "const fetchWithRetry = async (url, n = 3) => {",
  "  for (let i = 0; i < n; i++) {",
  "    const res = await fetch(url);",
  "    if (res.status === 200) return res.json();",
  "    if (res.status >= 500 && i !== n - 1)",
  "      await sleep(2 ** i * 100);",
  "  }",
  "  throw new Error(url ?? \"Request failed\");",
  "};",
].join("\n");
function themePreview() {
  return `<div class="preview" inert aria-label="Theme preview">

      <span class="sp"></span>
      <span class="tag got">Got it</span><span class="tag partly">Partly</span><span class="tag missed">Missed</span>
    </div>
    <div class="q-prompt">What does ${fmt("`fetchWithRetry`")} do when every attempt fails?</div>
    <div class="q-body">
      <div class="q-main">${codeBlock({ code: PREVIEW_CODE, lang: "ts" })}</div>
      <div class="q-main">
        <div class="options">
          <div class="opt correct"><span class="key">1</span><span class="txt">It throws an ${fmt("`Error`")} with the URL</span><span class="mark">correct answer</span></div>
          <div class="opt wrong"><span class="key">2</span><span class="txt">It returns ${fmt("`undefined`")}</span><span class="mark">your answer</span></div>
          <div class="opt sel"><span class="key">3</span><span class="txt">It retries forever</span><span class="mark"></span></div>
        </div>

      </div>

    <div class="model">
      <div class="label">${esc(APP.keyPointsLabel)}</div>
      <ul class="keypoints"><li class="hit"><span>Waits ${fmt("`2 ** i * 100`")} ms between attempts</span></li><li><span>Throws once all ${fmt("`n`")} attempts are used</span></li></ul>
      <ul class="links"><li><a>Using the Fetch API</a><small>developer.mozilla.org</small></li></ul>
    </div>
    <div class="acts"><span class="btn sm">Browse</span><span class="btn sm primary">Next question →</span></div>
  </div>`;
}

function buildReport(s) {
  const r = summarize(s);
  const strip = (t) => String(t).replace(/\*\*/g, "");
  const L = [
    `# ${APP.title}: ${s.label}`,
    "",
    `${new Date(s.startedAt).toLocaleString()} · Score **${r.pct}%** · ${r.done.length}/${s.ids.length} answered · total ${mmss(s.elapsed)} · avg ${secs(r.avg)} per question`,
    "",
    "| # | Question | Topic | Result | Time |",
    "|---|----------|-------|--------|------|",
    ...r.done.map((id) => {
      const q = Q.get(id), a = s.answers[id];
      return `| ${s.ids.indexOf(id) + 1} | ${strip(q.prompt).replace(/\|/g, "\\|")} | ${catOf(q).title} › ${topicName(q)} | ${RESULTS[a.result].label} | ${secs(a.ms)} |`;
    }),
  ];
  const misses = r.done.filter((id) => s.answers[id].result !== "correct" && s.answers[id].result !== "got");
  if (misses.length) {
    L.push("", "## Study plan", "");
    for (const id of misses) {
      const q = Q.get(id);
      L.push(`- **${strip(q.prompt)}** (${catOf(q).title} › ${topicName(q)}, ${RESULTS[s.answers[id].result].label.toLowerCase()})`);
      L.push(`  - ${strip(firstSentence(q.type === "mcq" ? q.explain || "" : q.answer))}`);
      for (const [t, u] of q.links) L.push(`  - [${t}](${u})`);
    }
  }
  return L.join("\n");
}

function renderChrome() {
  const tabs = [["library", "library"], ["browse", "browse"]];
  if (session) tabs.push(["session", `session ${session.idx + 1}/${session.ids.length}`]);
  if (report) tabs.push(["report", "report"]);
  tabs.push(["settings", "settings"]);
  document.getElementById("tabs").innerHTML = tabs.map(([v, l]) =>
    `<button class="tab" data-view="${v}" aria-current="${view === v}"><span class="dot">◆</span> ${esc(l)}</button>`).join("");

  const crumb = document.getElementById("crumb");
  if (view === "session" && session) {
    const q = Q.get(curId());
    crumb.innerHTML = `${esc(APP.slug)} › <b>${esc(catOf(q).title)}</b> › <em>${esc(topicName(q))}</em>`;
  } else if (view === "report" && report) crumb.innerHTML = `${esc(APP.slug)} › <b>report</b> › <em>${esc(report.label)}</em>`;
  else if (view === "browse") crumb.innerHTML = `${esc(APP.slug)} › <b>browse</b>${browseQuery ? ` › <em>${esc(browseQuery)}</em>` : ""}`;
  else if (view === "settings") crumb.innerHTML = `${esc(APP.slug)} › <b>settings</b>`;
  else crumb.innerHTML = `${esc(APP.slug)} › <b>library</b>`;

  const showClock = !!session && view === "session";
  document.getElementById("clock").hidden = !showClock;
  document.getElementById("clock").classList.toggle("paused", !!session?.paused);
  const pb = document.getElementById("pauseBtn");
  pb.hidden = !showClock;

const SANS_FALLBACK = "-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";
const MONO_FALLBACK = "'SF Mono',Menlo,Consolas,monospace";
const FONTS = {
  sans: [
    { id: "plex", name: "IBM Plex Sans (default)", family: "IBM Plex Sans" },
    { id: "inter", name: "Inter", family: "Inter", gf: "Inter:wght@400;500;600;700" },

    { id: "lexend", name: "Lexend", family: "Lexend", gf: "Lexend:wght@400;500;600;700" },
    { id: "sourceserif", name: "Source Serif 4", family: "Source Serif 4", gf: "Source+Serif+4:wght@400;500;600;700", fallback: "Georgia,'Times New Roman',serif" },
    { id: "system", name: "System font (no download)", family: null },
  ],
  mono: [
    { id: "jetbrains", name: "JetBrains Mono (default)", family: "JetBrains Mono" },
    { id: "fira", name: "Fira Code", family: "Fira Code", gf: "Fira+Code:wght@400;500;700" },
    { id: "sourcecode", name: "Source Code Pro", family: "Source Code Pro", gf: "Source+Code+Pro:wght@400;500;700" },
    { id: "plexmono", name: "IBM Plex Mono", family: "IBM Plex Mono", gf: "IBM+Plex+Mono:wght@400;500;700" },
    { id: "robotomono", name: "Roboto Mono", family: "Roboto Mono", gf: "Roboto+Mono:wght@400;500;700" },
    { id: "system", name: "System monospace (no download)", family: null },
  ],
};
const fontIds = { sans: store.get(K.fontSans) || FONTS.sans[0].id, mono: store.get(K.fontMono) || FONTS.mono[0].id };
let ligatures = store.get(K.ligatures) !== false;
const fontOf = (kind) => FONTS[kind].find((f) => f.id === fontIds[kind]) || FONTS[kind][0];
const fontStack = (kind, f) => {
  const fb = f.fallback || (kind === "sans" ? SANS_FALLBACK : MONO_FALLBACK);
  return f.family ? `'${f.family}',${fb}` : fb;
};
// Adds a font's Google Fonts stylesheet once. Resolves true if it loaded.
const fontLinks = {};
function loadFontCss(f) {
  if (!f.gf) return Promise.resolve(true);
  if (fontLinks[f.id]) return fontLinks[f.id];
  return (fontLinks[f.id] = new Promise((res) => {
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = `https://fonts.googleapis.com/css2?family=${f.gf}&display=swap`;
    l.onload = () => res(true);
    l.onerror = () => { delete fontLinks[f.id]; l.remove(); res(false); };
    document.head.appendChild(l);
  }));
}
// True only if the browser actually got the font files (not just the stylesheet).
async function fontAvailable(f) {
  if (!f.family) return true;
  if (!(await loadFontCss(f))) return false;
  if (!document.fonts || !document.fonts.load) return true;
  try {
    const faces = await Promise.race([document.fonts.load(`16px "${f.family}"`), new Promise((r) => setTimeout(() => r(null), 10000))]);
    return !!(faces && faces.length);
  } catch { return false; }
}
async function checkFont(kind) {
  const f = fontOf(kind);
  if (await fontAvailable(f)) return true;
  if (fontOf(kind) === f) toast(`Couldn’t download ${f.family}, so the system font is used. Fonts need an internet connection.`);
  return false;
}
function applyFonts() {
  for (const kind of ["sans", "mono"]) {
    const f = fontOf(kind);
    fontIds[kind] = f.id;
    document.documentElement.style.setProperty(`--${kind}`, fontStack(kind, f));
    loadFontCss(f);
  }
  document.documentElement.style.setProperty("--lig", ligatures ? "normal" : "none");
}
function setFont(kind, id) {
  fontIds[kind] = FONTS[kind].some((f) => f.id === id) ? id : FONTS[kind][0].id;
  store.set(kind === "sans" ? K.fontSans : K.fontMono, fontIds[kind]);
  applyFonts();
  if (view === "settings") render();
  return checkFont(kind);
}
function setLigatures(on) {
  ligatures = !!on;
  store.set(K.ligatures, ligatures);

}

// Backup: export / import, to move data between browsers
// ============================================================
const CAN_DOWNLOAD = CAN_PRINT; // the hosted viewer blocks downloads too

function exportData() {
  return { app: APP.slug, version: 2, exportedAt: new Date().toISOString(), stats, marks: [...marks], history, filters, session };
}
function describeBackup(d) {
  const all = Object.values(migrateAll(d.stats)).map(infoOf);
  const answered = all.filter((i) => i.attempts).length;
  const seen = all.filter((i) => i.seen).length;
  return `${plural(answered, "answered question")}, ${seen} seen, ${plural((d.marks || []).length, "bookmark")}, ${plural((d.history || []).length, "past session")}${d.session ? ", 1 session in progress" : ""}`;
}
function parseBackup(text) {
  let d;
  try { d = JSON.parse(text); } catch { throw new Error("This isn’t valid JSON. Paste the whole backup, from the first { to the last }."); }
  if (!d || d.app !== APP.slug) throw new Error(`This doesn’t look like a ${APP.title} backup.`);
  if (!d.stats || typeof d.stats !== "object" || !Array.isArray(d.marks) || !Array.isArray(d.history)) throw new Error("The backup is missing its progress, bookmarks or history.");
  d.stats = migrateAll(d.stats); // version-1 backups used flat stats
  return d;
}
// A session copied from another browser comes in paused, with its clocks settled.
function settledSession(src) {
  const s = JSON.parse(JSON.stringify(src));
  const end = s.lastSeen || s.runningSince || 0;
  if (!s.paused && s.runningSince) s.elapsed += Math.max(0, end - s.runningSince);
  s.runningSince = null;
  s.paused = true;
  for (const a of Object.values(s.answers || {})) if (a.since != null) { a.ms += Math.max(0, (s.lastSeen || a.since) - a.since); a.since = null; }
  return s;
}
// Per question, combine both logs. The same session in both keeps its newer entry.
function mergeLogs(mine, theirs) {
  const out = JSON.parse(JSON.stringify(mine));
  for (const [id, t] of Object.entries(theirs)) {
    const m = out[id];
    if (!m) { out[id] = JSON.parse(JSON.stringify(t)); continue; }
    const bySession = new Map(m.log.map((e) => [e.s, e]));
    for (const e of t.log) {
      const cur = bySession.get(e.s);
      if (!cur || (e.at || 0) > (cur.at || 0)) bySession.set(e.s, { ...e });
    }
    m.log = [...bySession.values()].sort((x, y) => (x.at || 0) - (y.at || 0)).slice(-LOG_CAP);
    if (t.seenReset != null) m.seenReset = Math.max(m.seenReset ?? 0, t.seenReset);
  }
  return out;
}
function applyBackup(d, mode) {
  const hist = d.history.filter(validSession);
  const theirMarks = d.marks.filter((id) => Q.has(id));
  if (mode === "replace") {
    stats = { ...d.stats };
    marks = new Set(theirMarks);
    history = hist.slice(-30);
    if (d.filters) {
      filters = Object.assign(defaultFilters(), d.filters);
      filters.cats = (filters.cats || []).filter((id) => CATEGORIES.some((c) => c.id === id));
    }
    session = validSession(d.session) ? settledSession(d.session) : null;
  } else {
    stats = mergeLogs(stats, d.stats);
    theirMarks.forEach((id) => marks.add(id));
    const byId = new Map(history.map((s) => [s.id, s]));
    for (const s of hist) if (!byId.has(s.id)) byId.set(s.id, s);
    history = [...byId.values()].sort((a, b) => a.startedAt - b.startedAt).slice(-30);
    if (!session && validSession(d.session)) session = settledSession(d.session);
  }
  saveStats(); saveMarks(); saveFilters(); saveSession();
  store.set(K.history, history);
  report = null;
  view = "library";
}
